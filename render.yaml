services:
  - type: web
    name: reviewtap
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reviewtap-db
          property: connectionString

databases:
  - name: reviewtap-db
    plan: free
    databaseName: reviewtap
