services:
  - type: web
    name: reviewtap
    runtime: python
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://reviewtap.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: reviewtap-db
          property: connectionString

databases:
  - name: reviewtap-db
    plan: free
    databaseName: reviewtap
