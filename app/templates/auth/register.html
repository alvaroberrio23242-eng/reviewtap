<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — ReviewTap</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('landing.static', filename='css/landing.css') }}">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 2rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
      color: var(--text);
    }
    .auth-logo svg { width: 28px; height: 28px; }
    .auth-logo span { font-size: 1.25rem; font-weight: 700; }
    .auth-card h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .auth-card .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--text);
    }
    .form-group input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }
    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-primary:hover { opacity: 0.9; }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>ReviewTap</span>
      </a>
      <h1>Crear cuenta</h1>
      <p class="subtitle">Empieza a recopilar feedback real</p>

      <div class="error-msg" id="error-msg"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="full_name">Nombre completo</label>
          <input type="text" id="full_name" name="full_name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary">Crear cuenta gratis</button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
      </div>
    </div>
  </div>

  <script>
  document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var errorMsg = document.getElementById('error-msg');
    errorMsg.style.display = 'none';

    var full_name = document.getElementById('full_name').value;
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;

    try {
      var response = await fetch('/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
        },
        body: JSON.stringify({ full_name: full_name, email: email, password: password })
      });

      var data;
      try {
        data = await response.json();
      } catch (parseErr) {
        errorMsg.textContent = 'Error del servidor';
        errorMsg.style.display = 'block';
        return;
      }

      if (response.ok) {
        window.location.href = '/login';
      } else {
        errorMsg.textContent = data.error || 'Error al crear cuenta';
        errorMsg.style.display = 'block';
      }
    } catch (err) {
      errorMsg.textContent = 'Error de conexión';
      errorMsg.style.display = 'block';
    }
  });
  </script>
</body>
</html>
